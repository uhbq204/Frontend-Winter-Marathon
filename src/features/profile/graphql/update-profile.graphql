mutation UpdateProfile($input: UserUpdateCustomInput!) {
    updateProfile(input: $input) {
        id
        email
        profile {
            fullName
            gender
            age
            bio
        }
        measurements {
            heightCm
            weightKg
            goalWeightKg
            chestCm
            waistCm
            thighCm
            armCm
            activityLevel
            nutritionGoal
        }
    }
}